[project]
name = "mj-analytics"
version = "0.1.0"
description = "MJ Nexus の分析モジュール（フロントエンドから独立したPythonパッケージ）"
requires-python = ">=3.11"
dependencies = [
  "pandas>=2.2",
  "numpy>=1.26",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["mj_analytics*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
