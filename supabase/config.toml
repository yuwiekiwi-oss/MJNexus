# Supabase CLI のローカル開発設定（`supabase start` で使用）
# 本番プロジェクトの認証設定は Supabase ダッシュボードでも同じ値にすること。
project_id = "mj-nexus"

[api]
enabled = true
port = 54321
schemas = ["public"]
extra_search_path = ["public", "extensions"]
max_rows = 1000

[db]
port = 54322
major_version = 17

[db.seed]
# 初期状態は空のDB。サンプルデータは自動投入しない（docs/database-design.md 参照）
enabled = false

[auth]
enabled = true
site_url = "http://localhost:5173"
additional_redirect_urls = ["http://localhost:5173"]
jwt_expiry = 3600
# 未成年の情報を扱うため招待制（自由な新規登録を無効化）
enable_signup = false

[auth.email]
enable_signup = false
double_confirm_changes = true
enable_confirmations = true
